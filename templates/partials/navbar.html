{% extends "base.html" %}
{% block content %}



<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'index' %}">BLOG</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'index' %}">Accueil</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'page1' %}">Liste des Articles</a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link" href="{% url 'page3' %}">Ajouter Un Article</a>
        </li>


        <li class="nav-item dropdown">
          <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
            <a class="dropdown-item" href="{% url 'page1' %}">Liste des Articles</a>
            <a class="dropdown-item" href="#">Détails Articles</a>
            <a class="dropdown-item" href="{% url 'page3' %}">Ajouter un Article</a>
          </div>
        </li>
            
      </ul>

      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          {% if request.user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}" class="d-flex">
            {% csrf_token %}
            <button class="btn btn-outline-danger" type="submit">Déconnexion</button>
          </form>
          {% else %}
          <form method="post" action="{% url 'login' %}" class="d-flex">
            {% csrf_token %}
            <button class="btn btn-secondary" type="submit">Connexion</button>
          </form>
          {% endif %}
        </li>
      </ul>
    </div>
  </div>
</nav>

{% endblock %}
